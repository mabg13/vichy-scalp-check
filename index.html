<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vichy Scalp Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, dermatological, reassuring — a pharmacy-grade scalp check.
   IDEA: a lab test report you carry in your pocket: readings, sources, a prescription-like routine.
   PICTURE: the score ring + four reading tiles; the calibration card with vial and pH strip.
   COLOUR and TYPE: deep teal-black #0B252B, lime accent #D8F396, four soft pastel tiles; DM Sans.
   LAYOUT: one phone-width column (max 460px), sticky bottom tabs in the app view. */
:root{--bg:#EEF2EF;--navy:#0B252B;--navy2:#173D43;--ink:#0B252B;--muted:#5C6B68;--line:#DDE4E1;--card:#fff;--lime:#D8F396;--limeD:#C1E074;--green:#2E7D66;
--t1:#F3DACB;--i1:#7A3E22;--b1:#E3A07F;--t2:#DDEBD3;--i2:#2E6B3F;--b2:#86BC72;--t3:#EFE3CF;--i3:#6E5530;--b3:#CDAE80;--t4:#E4DAF1;--i4:#4F3D86;--b4:#A48FD3;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,label:focus-within{outline:3px solid #6aa7ff;outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px}
@media(min-width:620px){body{background:#DCE4E0}.app{box-shadow:0 0 0 1px #cfd8d4,0 30px 80px rgba(11,37,43,.12)}}
.hero{background:var(--navy);color:#fff;border-radius:0 0 28px 28px;padding:22px 20px 26px;position:relative;overflow:hidden}
.hero{background:radial-gradient(120% 90% at 100% 0%,#1d4a4f 0%,#0B252B 55%)}
.hero .strands{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
.art{position:relative;height:250px;margin:6px -20px 0}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.lens{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #D8F396,0 0 0 12px rgba(216,243,150,.18),0 20px 40px rgba(0,0,0,.35)}
.lens svg{position:absolute;inset:0;width:100%;height:100%}
.lens:after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#D8F396,transparent);box-shadow:0 0 12px #D8F396;animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:12%}50%{top:86%}}
.pin{position:absolute;background:#fff;color:#0B252B;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;box-shadow:0 6px 16px rgba(0,0,0,.25);white-space:nowrap}
.pin i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}.lang button{min-width:40px;min-height:34px;border-radius:99px;color:#fff;font-size:12px;font-weight:700;opacity:.75}.lang button.on{background:#fff;color:#0B252B;opacity:1}
.quip{position:relative;display:inline-block;background:#fff;color:#0B252B;font-size:14px;font-weight:600;line-height:1.35;padding:10px 14px;border-radius:16px 16px 16px 4px;margin:4px 0 6px;max-width:100%}
.quip b{color:#2E7D66}
.cycle{min-height:1.5em;text-align:center;font-weight:600;color:var(--green)}
.hero>*{position:relative;z-index:1}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-size:13px;letter-spacing:.06em;color:var(--lime)}
.brand small{display:block;font-size:11px;opacity:.7;letter-spacing:.03em}
.iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.iconbtn svg{width:20px;height:20px}
h1{font-family:Manrope,"DM Sans",sans-serif;font-size:31px;line-height:1.06;margin:18px 0 8px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:Manrope,"DM Sans",sans-serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--lime)}
h2{font-size:22px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-size:16px;margin:0 0 4px}
.lead{opacity:.82;margin:0;font-size:15px}
.wrap{padding:16px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:13px;font-weight:600;color:var(--green);margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:var(--lime);font-weight:700;font-size:16px;color:var(--navy);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.link{background:none;min-height:44px;font-weight:600;color:var(--green);text-decoration:underline}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.steps .st{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.steps .st:last-child{border:0}
.num{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#EEF2EF;color:var(--navy2);white-space:nowrap}
.profiles{display:grid;gap:8px}
.prof{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);min-height:56px}
.prof b{display:block;font-size:15px}.prof span{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.top .iconbtn{background:#fff;color:var(--navy);border:1px solid var(--line)}
.prog{flex:1;height:6px;border-radius:9px;background:#d5ddd9;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{width:100%;text-align:left;padding:16px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-weight:600;min-height:56px}
.opt.on{border-color:var(--navy);background:#F5F9E8}
.shot{position:relative;border-radius:20px;overflow:hidden;background:#1a2f33;aspect-ratio:3/4;display:grid;place-items:center;color:#fff}
.shot img,.shot canvas{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:14% 18%;border:2px dashed rgba(216,243,150,.9);border-radius:50%;pointer-events:none}
.guide.rect{inset:12% 10%;border-radius:14px}
.shot .tag{position:absolute;left:12px;bottom:12px;background:rgba(11,37,43,.8);padding:6px 10px;border-radius:10px;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs div{border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:#dfe6e3;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(255,255,255,.9);padding:2px 6px;border-radius:6px;font-weight:600}
.file{position:absolute;width:1px;height:1px;opacity:0}
.kit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kit div{background:#F6F8F7;border-radius:14px;padding:10px;text-align:center;font-size:12px;font-weight:600}
.kit svg{width:44px;height:56px;display:block;margin:0 auto 6px}
ol.how{padding-left:20px;margin:8px 0 0}ol.how li{margin-bottom:6px}
.timer{font-size:44px;font-weight:700;text-align:center;letter-spacing:.02em;margin:8px 0;font-variant-numeric:tabular-nums}
.cardwrap{position:relative;border-radius:16px;overflow:hidden;background:#222;touch-action:manipulation}
.cardwrap canvas{display:block;width:100%;height:auto}
.mark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--navy);pointer-events:none}
.mark b{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;white-space:nowrap}
.read{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.read:last-child{border:0}
.sw{width:44px;height:44px;border-radius:12px;border:1px solid rgba(0,0,0,.08)}
.read .v{font-weight:700;font-size:18px;text-align:right;white-space:nowrap}
.fuse{display:grid;gap:10px;margin:24px 0}
.src{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);opacity:.35;transition:opacity .4s}
.src.on{opacity:1}
.src i{width:12px;height:12px;border-radius:50%;background:var(--limeD);flex:none}
.spin{width:64px;height:64px;margin:20px auto;border-radius:50%;border:6px solid #d5ddd9;border-top-color:var(--green);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.score{display:flex;gap:16px;align-items:center;margin-top:14px}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-size:34px}.ring small{display:block;font-size:10px;opacity:.75;margin-top:4px;letter-spacing:.04em}
.mp{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.mp button{min-height:34px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:700}.mp button.on{background:var(--lime);color:var(--navy)}
.delta{display:inline-block;background:rgba(216,243,150,.18);color:var(--lime);font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{border-radius:18px;padding:12px 14px}
.tile .n{font-size:13px;font-weight:600}
.tile .val{font-size:30px;font-weight:700;line-height:1.1;margin:2px 0}
.tile .lv{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.7);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.tile .from{font-size:11px;margin-top:6px;opacity:.85}
.tile.locked{background:#fff!important;border:1.5px dashed var(--line);color:var(--muted)}
.cause{background:var(--navy);color:#fff;border:0}
.cause .label{color:var(--lime)}
.ev{display:grid;gap:6px;margin-top:10px}
.ev div{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.ev div:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none;margin-top:8px}
.prod{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.prod:last-of-type{border-bottom:0}
.pack{width:72px;height:100px;border-radius:12px;display:grid;place-items:center}
.pack svg{width:46px;height:84px}
.prod .b{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.prod h3{font-size:15px;line-height:1.25;margin:2px 0}
.why{font-size:13px;background:#F5F9E8;border-radius:10px;padding:6px 9px;margin-top:6px}
.use{font-size:13px;color:var(--muted);margin-top:4px}
.buy{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.field{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:10px 0}.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:#0B252B}
.price{font-weight:700;white-space:nowrap;margin-top:6px}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg button{font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;background:#EEF2EF;min-height:36px}
.seg button.on{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.up{color:var(--green);font-weight:700}.down{color:#B4432D;font-weight:700}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ba div{border-radius:14px;overflow:hidden;aspect-ratio:3/4;position:relative;background:#dfe6e3}
.ba img{width:100%;height:100%;object-fit:cover}
.ba span{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);min-height:52px;padding-top:6px;border-radius:12px}
.tabs button.on{color:var(--navy);background:#F5F9E8}
.tabs svg{width:22px;height:22px}
.disc{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(11,37,43,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.note{font-size:13px;background:#FFF5D9;color:#6E5530;border-radius:12px;padding:10px 12px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 return o==null?s:s.replace(k,o)}

 list.forEach(n=>{const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});

/* Root-cause reasoning: photo (symptom) + kit (cause) + answers (context) */
function causes(c){

 else if(fibreLow)out.push({id:"fibre",ax:"fibre",t:"Weakened keratin",d:"The hair fibre is porous and loses protein, which leads to dullness and breakage.",ev:[`Fibre strength ${s.fibre}: vial turned violet`].concat(a.treat!=="Never"?[`Colouring or heat styling: ${a.treat.toLowerCase()}`]:[])});
 if(s.flakes<62&&kit&&s.ph<62)out.push({id:"alkaline",ax:"flakes",t:"Alkaline scalp feeding the flakes",d:"Your scalp pH is above the healthy 4.5–5.5 range. An alkaline scalp lets the yeast behind dandruff (Malassezia) thrive, so the flakes come back.",ev:[`Flakes ${s.flakes}: flakes counted along the parting`,`pH ${c.kit.ph.toFixed(1)} on the strip`]});

/* Causes → Dercos routine. One shampoo max, up to two treatments. */
function routine(c){

 const add=(id,why)=>{if(out.some(x=>x.id===id))return;const k=P[id].kind;if(k==="shampoo"&&out.some(x=>P[x.id].kind==="shampoo"))return;if(k==="treatment"&&out.filter(x=>P[x.id].kind==="treatment").length>=2)return;out.push({id,why})};
 const amx=men?"amxM":"amxW";
 if(ids.includes("alkaline"))add((a.feel==="Calm"||a.feel==="Sensitive, reactive")?"dsDry":"dsOily","Selenium disulfide clears the flakes and rebalances the scalp.");
 if(ids.includes("flakes"))add(a.feel==="Greasy within a day"?"dsOily":"sooth",a.feel==="Greasy within a day"?"Clears visible flakes on an oily scalp.":"Calms a dry, reactive scalp that flakes.");
 if(ids.includes("mixed")){add(amx,"Targets hair fall at the root.");add("c17pre","Refills the fibre where the vial showed keratin loss.");add("c17sh","Repairs the fibre at every wash.")}
 if(ids.includes("root")){add(amx,"Strengthens the anchoring of the hair at the root.");add("energy","Energising wash for hair-fall prone hair.")}
 if(ids.includes("breakage")||ids.includes("fibre")){add("c17pre","Repairs the fibre that the vial showed as damaged.");add("c17sh","Keeps rebuilding the fibre at every wash.")}
 if(ids.includes("ph"))add("sooth","Gentle wash that respects the scalp's natural pH.");
 if(ids.includes("oily"))add("oil","Regulates sebum without drying the scalp.");
 if(ids.includes("reactive"))add("sooth","Soothes a reactive scalp.");
 if(!out.length){ /* balanced: maintenance, coherent with history */
  const prev=(S.checks.length>1&&c!==first())?routine(first()).map(x=>x.id):[];const sh=prev.find(id=>P[id].kind==="shampoo");
  add(sh||"mineral",sh?"Keep the shampoo that got you here: everything is back in range.":"Everything is in range: a gentle everyday shampoo is enough.");
 }

}

/* ---------- image tools ---------- */
function rng(seed){let s=seed;return()=>{s=Math.sin(s)*10000;return s-Math.floor(s)}}
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}

const rgbs=a=>`rgb(${a.map(Math.round).join(",")})`;
function vialColor(k){return BEIGE.map((c,i)=>c+(VIOLET[i]-c)*k)}
function readPh(rgb){let best=4.5,bd=1e9;for(let v=4.5;v<=7.51;v+=.05){const c=phColor(v),d=(c[0]-rgb[0])**2+(c[1]-rgb[1])**2+(c[2]-rgb[2])**2;if(d<bd){bd=d;best=v}}return Math.round(best*10)/10}
function readK(rgb){const d=VIOLET.map((v,i)=>v-BEIGE[i]),p=rgb.map((v,i)=>v-BEIGE[i]);return clamp(p.reduce((a,v,i)=>a+v*d[i],0)/d.reduce((a,v)=>a+v*v,0),0,1)}
function thumb(src,w=420){const t=document.createElement("canvas");t.width=w;t.height=Math.round(w*src.height/src.width);t.getContext("2d").drawImage(src,0,0,t.width,t.height);return t.toDataURL("image/jpeg",.72)}
function pixels(src,size){const w=size,h=Math.round(size*src.height/src.width),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0,w,h);return{d:x.getImageData(0,0,w,h).data,w,h}}
const isSkin=(r,g,b)=>r>g&&g>b&&r-b>30&&r>120;
/* Simple on-device reading of a real photo (concept demo; production = trained segmentation model) */
function analyzeReal(id,img){
 const p=pixels(img,220);let skin=0,tot=0,specks=0;
 const y0=Math.round(p.h*(id==="temples"?0:.15)),y1=Math.round(p.h*(id==="temples"?.55:.85)),x0=Math.round(p.w*(id==="parting"?.3:.2)),x1=Math.round(p.w*(id==="parting"?.7:.8));
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const j=(y*p.w+x)*4,r=p.d[j],g=p.d[j+1],b=p.d[j+2];tot++;if(isSkin(r,g,b))skin++;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx>225&&mx-mn<28)specks++}
 const ratio=skin/Math.max(1,tot);
 const density=id==="temples"?interp(ratio,[.15,.25,.4,.55],[94,80,52,28]):id==="parting"?interp(ratio,[.04,.09,.18,.3],[94,78,48,24]):interp(ratio,[.03,.08,.16,.26],[94,76,44,22]);

}

 const c=document.createElement("canvas");c.width=900;c.height=600;const x=c.getContext("2d"),r=rng(seed);

function hairSVG(seed,n=34,op=1){const r=rng(seed);let d="";for(let i=0;i<n;i++){const y0=-40+i*11+r()*8,c1=y0+60+r()*60,c2=y0+120+r()*80,y3=y0+150+r()*90,w=.8+r()*1.6;
 d+=`<path d="M-20 ${y0.toFixed(1)} C 120 ${c1.toFixed(1)}, 260 ${(c2-90).toFixed(1)}, 420 ${y3.toFixed(1)}" stroke="url(#hg${seed})" stroke-width="${w.toFixed(2)}" fill="none" stroke-linecap="round" opacity="${(.35+r()*.65).toFixed(2)}"/>`}
 return `<svg class="strands" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="opacity:${op}"><defs><linearGradient id="hg${seed}" x1="0" x2="1"><stop offset="0" stop-color="#2f6a6f" stop-opacity=".2"/><stop offset=".55" stop-color="#7fb39a"/><stop offset="1" stop-color="#D8F396" stop-opacity=".35"/></linearGradient></defs>${d}</svg>`}
function lensSVG(){const r=rng(7);let f="";for(let i=0;i<46;i++){const x=10+r()*150,y=10+r()*150,a=-.9+r()*.5,L=22+r()*30;
 f+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#7a4b37" opacity=".55"/><path d="M${x.toFixed(1)} ${y.toFixed(1)} q ${(Math.cos(a)*L*.5).toFixed(1)} ${(Math.sin(a)*L*.3).toFixed(1)} ${(Math.cos(a)*L).toFixed(1)} ${(Math.sin(a)*L).toFixed(1)}" stroke="#3a2419" stroke-width="${(1.6+r()*1.2).toFixed(1)}" fill="none" stroke-linecap="round"/>`}
 for(let i=0;i<5;i++)f+=`<ellipse cx="${(20+r()*130).toFixed(0)}" cy="${(20+r()*130).toFixed(0)}" rx="3.5" ry="2.2" fill="#fbf7ef" opacity=".9"/>`;
 return `<svg viewBox="0 0 170 170" aria-hidden="true"><defs><radialGradient id="sk" cx=".4" cy=".35"><stop offset="0" stop-color="#ecc9ad"/><stop offset="1" stop-color="#c99778"/></radialGradient></defs><rect width="170" height="170" fill="url(#sk)"/>${f}</svg>`}
function homeArt(){return `<div class="art">${hairSVG(3,30)}<div class="lens">${lensSVG()}</div>
 <span class="pin" style="left:6%;top:14%"><i style="background:#E3A07F"></i>Density 84</span>
 <span class="pin" style="right:5%;top:22%"><i style="background:#CDAE80"></i>pH 5.2</span>
 <span class="pin" style="left:4%;bottom:16%"><i style="background:#A48FD3"></i>Keratin intact</span>
 <span class="pin" style="right:7%;bottom:10%"><i style="background:#86BC72"></i>2 flakes</span></div>`}

function quip(c){const cs=causes(c),id=cs[0]&&cs[0].id,d=c.scores.overall-first().scores.overall;
 if(!id)return c!==first()&&d>=8?`+${d} points. Your hairdresser is about to get <b>a lot</b> busier.`:"Honestly? Your scalp is doing better than most of us on a Monday.";
 return {root:"Upside: fewer trips to the hairdresser. Downside: we'd rather send you back there. Let's fix it.",
  mixed:"Your hair is fighting on two fronts. Good thing we brought two products.",
  breakage:"Good news: your hair isn't leaving you. It's just <b>breaking up</b>. Much easier to fix.",
  fibre:"Your hair has been through a lot (hello, straightener). Time for some repair.",
  alkaline:"Washing once a month? Kidding. Dandruff isn't about hygiene, it's your <b>scalp pH</b>.",
  flakes:"Snowing already? Those flakes aren't seasonal.",
  ph:"Your scalp is a little too <b>basic</b>. Chemically speaking.",
  oily:"Your roots could dress a salad. Let's calm them down.",
  reactive:"Your scalp is a bit of a drama queen. We'll keep things gentle."}[id]||"";}

 if(k===2)return topBar(pct)+`<div class="wrap"><div class="label">Test 2 of 2 · pH strip</div><h2>What is your scalp pH?</h2>

 ${f.cal?vReadings(f.cal):""}
 <div style="display:grid;gap:10px;margin-top:12px">
 ${f.cal?`<button class="btn" data-act="finish">See my results ${IC.arrow}</button><button class="btn ghost" data-act="resetCard">Retake</button>`:f.cardCanvas?`<button class="btn ghost" data-act="resetCard">Retake</button>`:

 const keys=["overall","density","flakes","ph","fibre"],names={overall:"Overall",density:"Density",flakes:"Flakes",ph:"pH",fibre:"Fibre"};
 return `<div class="hero">${brand()}<h1>${ch.length-1} month${ch.length>2?"s":""} of tracking</h1><p class="lead">Score ${f0.scores.overall} → ${c.scores.overall} since ${fmtDate(f0.date)}.</p></div>
 <div class="wrap"><div class="card"><div class="seg">${keys.map(k=>`<button class="${UI.metric===k?"on":""}" data-metric="${k}">${names[k]}</button>`).join("")}</div><div class="fig"><svg id="chart"></svg></div></div>
 <div class="card"><div class="label">Month 0 vs now</div><table><thead><tr><th>Reading</th><th>M0</th><th>M${c.month}</th><th>Change</th></tr></thead><tbody>
 ${AXES.map(a=>{const x=f0.scores.s[a.id],y=c.scores.s[a.id];if(x==null||y==null)return "";const dd=y-x;return `<tr><td>${a.name}</td><td>${x}</td><td>${y}</td><td class="${dd>0?"up":dd<0?"down":""}">${dd>0?"+":""}${dd}</td></tr>`}).join("")}</tbody></table>
 ${c.kit&&f0.kit?`<p class="small muted" style="margin:8px 0 0">pH ${f0.kit.ph.toFixed(1)} → ${c.kit.ph.toFixed(1)} · vial index ${f0.kit.k.toFixed(2)} → ${c.kit.k.toFixed(2)}</p>`:""}</div>
 ${f0.photos.parting&&c.photos.parting?`<div class="card"><div class="label">Centre parting · before / after</div><div class="ba"><div><img src="${f0.photos.parting}" alt="Month 0"><span>M0</span></div><div><img src="${c.photos.parting}" alt="Now"><span>M${c.month}</span></div></div></div>`:""}
 <div class="card"><div class="label">How the routine changed</div>${ch.map(k=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><b class="small">M${k.month}</b><span class="small muted" style="text-align:right">${routine(k).map(x=>P[x.id].name).join(" + ")}</span></div>`).join("")}</div>
 <button class="btn" data-act="again">Do this month's check</button></div>`;
}
function drawChart(){
 const s=$("#chart");if(!s||!s.clientWidth)return;const W=s.clientWidth,H=s.clientHeight,ch=S.checks,k=UI.metric;
 const vals=ch.map(c=>k==="overall"?c.scores.overall:c.scores.s[k]).map(v=>v??null);
 const pl=30,pr=14,pt=14,pb=26,X=i=>pl+(W-pl-pr)*(ch.length===1?.5:i/(ch.length-1)),Y=v=>pt+(H-pt-pb)*(1-v/100);
 let g="";[0,50,100].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3E8E5"/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#5C6B68">${v}</text>`);
 const pts=vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
 g+=`<rect x="${pl}" y="${Y(80)}" width="${W-pl-pr}" height="${Y(62)-Y(80)}" fill="#F5F9E8"/>`;
 if(pts.length)g+=`<path d="M${pts.map(p=>p.join(",")).join("L")}" fill="none" stroke="#2E7D66" stroke-width="3" stroke-linejoin="round"/>`;
 vals.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="#fff" stroke="#2E7D66" stroke-width="2.5"/><text x="${X(i)}" y="${Y(v)-10}" font-size="12" font-weight="700" text-anchor="middle" fill="#0B252B">${v}</text>`});
 ch.forEach((c,i)=>g+=`<text x="${X(i)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#5C6B68">M${c.month}</text>`);
 s.innerHTML=g;
}
const chartRO=new ResizeObserver(drawChart);

function vApp(){
 const body=UI.tab==="routine"?vRoutine():UI.tab==="progress"?vProgress():vReport();
 return body+`<nav class="tabs">${[["report","Report",IC.report],["routine","Routine",IC.bottle],["progress","Progress",IC.chart]].map(([k,n,i])=>`<button class="${UI.tab===k?"on":""}" data-tab="${k}">${i}${n}</button>`).join("")}</nav>`;
}

function render(){
 const el=$("#app");
 el.innerHTML=UI.view==="home"?vHome():UI.view==="flow"?vFlow():UI.view==="analysing"?vAnalysing():vApp();
 document.documentElement.lang=LANG;translate(el);
 document.querySelectorAll(".hero").forEach((h,i)=>{if(!h.querySelector(".art"))h.insertAdjacentHTML("afterbegin",hairSVG(11+i,26,.5))});
 if(UI.view==="app"&&UI.tab==="progress"){const s=$("#chart");if(s){chartRO.disconnect();chartRO.observe(s);drawChart()}}
 if(UI.view==="flow"&&UI.flow.step==="kit"&&UI.flow.cardCanvas)mountCard();
}
function toast(t){$("#layer").innerHTML=`<div class="toast">${esc(tr(t))}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#layer").innerHTML="",2600)}
function sheet(html){$("#layer").innerHTML=`<div class="sheet" data-act="closeSheet"><div>${html}</div></div>`;translate($("#layer"))}

/* ---------- card reading ---------- */
function mountCard(){
 const f=UI.flow,w=$("#cardwrap");if(!w)return;w.innerHTML="";const cv=f.cardCanvas;cv.style.width="100%";w.appendChild(cv);
 const lab={white:"White",liquid:"Vial",pad:"pH"};
 f.taps.forEach(t=>{const m=document.createElement("div");m.className="mark";m.style.left=(t.x/cv.width*100)+"%";m.style.top=(t.y/cv.height*100)+"%";m.innerHTML=`<b>${tr(lab[t.n])}</b>`;w.appendChild(m)});
 if(!f.cal)cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*cv.width),y=Math.round((e.clientY-r.top)/r.height*cv.height);
  const need=["white","liquid","pad"].find(n=>!f.taps.some(t=>t.n===n));f.taps.push({n:need,x,y});if(f.taps.length===3)readCard();render()};
}
function readCard(){const f=UI.flow,cv=f.cardCanvas,rad=Math.max(4,Math.round(cv.width/120)),g=n=>{const t=f.taps.find(t=>t.n===n);return sampleAt(cv,t.x,t.y,rad)};
 f.cal=calibrate({white:g("white"),liquid:g("liquid"),pad:g("pad")});f.card=thumb(cv,520)}
function loadFile(file,cb){const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{cb(img);URL.revokeObjectURL(url)};img.onerror=()=>toast("Could not read that image");img.src=url}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act],[data-ans],[data-prof],[data-tab],[data-metric],[data-sel],[data-lang]");if(!t)return;
 if(t.dataset.act==="closeSheet"&&e.target!==t)return;
 const f=UI.flow;
 if(t.dataset.prof){$("#layer").innerHTML="";buildProfile(t.dataset.prof);return}
 if(t.dataset.tab){UI.tab=t.dataset.tab;render();scrollTo(0,0);return}
 if(t.dataset.lang){LANG=t.dataset.lang;try{localStorage.setItem("dercos.lang",LANG)}catch(e){}render();return}
 if(t.dataset.sel!=null){UI.sel=+t.dataset.sel;render();return}
 if(t.dataset.metric){UI.metric=t.dataset.metric;render();return}
 if(t.dataset.ans!=null){const q=Q[f.qi];f.answers[q.id]=t.dataset.ans;render();setTimeout(()=>{if(f.qi<Q.length-1)f.qi++;else{f.step="photos";f.ai=0}render();scrollTo(0,0)},180);return}
 const a=t.dataset.act;
 if(t.closest(".sheet")&&a!=="closeSheet")$("#layer").innerHTML="";
 if(a==="start")startFlow(false);
 else if(a==="again"){UI.sel=null;startFlow(true)}
 else if(a==="back"){clearInterval(timerId);
  if(f.step==="q"){if(f.qi>0)f.qi--;else{UI.view=S.checks.length?"app":"home";UI.flow=null}}
  else if(f.step==="photos"){if(f.ai>0)f.ai--;else if(S.answers&&S.checks.length){UI.view="app";UI.flow=null}else{f.step="q";f.qi=Q.length-1}}
  else if(f.step==="kit"){if(f.kitStep>0)f.kitStep--;else{f.step="photos";f.ai=2}}
  render()}
 else if(a==="samplePhoto"){const g=ANGLES[f.ai],base=demoValues(f.answers),c=drawSample(g.id,base,f.ai*13+S.checks.length*5+1);f.photos[g.id]=thumb(c);f.metrics[g.id]={density:base.density+(f.ai-1)*2,flakes:g.id==="parting"?base.flakes:null,w:g.id==="temples"?.25:g.id==="parting"?.35:.4};render()}
 else if(a==="redo"){const g=ANGLES[f.ai];delete f.photos[g.id];delete f.metrics[g.id];render()}
 else if(a==="nextPhoto"){if(f.ai<2)f.ai++;else{f.step="kit";f.kitStep=0}render();scrollTo(0,0)}
 else if(a==="kitNext"){clearInterval(timerId);f.tRun=false;f.kitStep++;render();scrollTo(0,0)}
 else if(a==="noKit"){f.cal=null;f.card=null;finishFlow()}
 else if(a==="timer"){if(f.tRun)return;f.tRun=true;f.t=f.t??180;render();timerId=setInterval(()=>{f.t--;const el=$("#timer");if(el)el.textContent=fmtT(f.t);if(f.t<=0){clearInterval(timerId);f.tRun=false;f.kitStep++;render()}},1000)}
 else if(a==="sampleCard"){const v=demoValues(f.answers);f.cardCanvas=drawCard({k:v.k,ph:v.ph},S.checks.length+9);f.taps=Object.entries(CARD_PTS).map(([n,[x,y]])=>({n,x,y}));readCard();render()}
 else if(a==="resetCard"){f.cardCanvas=null;f.cal=null;f.card=null;f.taps=[];render()}
 else if(a==="finish")finishFlow();
 else if(a==="menu")sheet(`<h2>Menu</h2><div class="profiles" style="margin-top:12px">${Object.entries(PROFILES).map(([k,p])=>`<button class="prof" data-prof="${k}"><div><b>${p.name}</b><span>${p.tag}</span></div>${IC.arrow}</button>`).join("")}<button class="btn ghost" data-act="again">New monthly check</button><button class="btn link" data-act="reset">Start over (delete my data)</button></div>`);
 else if(a==="reset"){S=blank();save();UI={view:"home",tab:"report",flow:null,metric:"overall"};$("#layer").innerHTML="";render();scrollTo(0,0)}
 else if(a==="closeSheet")$("#layer").innerHTML="";
 else if(a==="pharmacy")sheet(`<h2>For your pharmacist</h2><p class="muted small">Scan or show this screen at the counter.</p><div class="card"><b>${esc(causes(cur())[0]?.t||"Balanced scalp")}</b><div class="small muted" style="margin-top:4px">Scores: ${AXES.map(x=>cur().scores.s[x.id]!=null?x.name+" "+cur().scores.s[x.id]:"").filter(Boolean).join(" · ")}</div><div style="margin-top:8px">${routine(cur()).map(x=>"• Dercos "+P[x.id].name+" — "+P[x.id].sub).join("<br>")}</div></div><button class="btn" data-act="closeSheet">Done</button>`);
 else if(a==="order")toast("Demo: hands over to the pharmacy's online shop");
 else if(a==="orderKit")toast("Demo: kit ordered — your €4.90 comes back as a Dercos voucher");
});
document.addEventListener("submit",e=>{
 if(e.target.id!=="mailf")return;e.preventDefault();
 const m=$("#mail").value.trim(),ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m),err=$("#mailerr");
 if(!ok){err.textContent=tr("Please enter a valid email address.");err.style.display="block";return}
 if(!$("#consent").checked){err.textContent=tr("Please tick the consent box to receive reminders.");err.style.display="block";return}
 S.email=m;save();render();toast("Demo: reminder scheduled — no email is actually sent");
});
document.addEventListener("change",e=>{
 const inp=e.target.closest("[data-file]");if(!inp||!inp.files[0])return;const f=UI.flow;
 loadFile(inp.files[0],img=>{
  if(inp.dataset.file==="photo"){const g=ANGLES[f.ai],m=analyzeReal(g.id,img);f.photos[g.id]=thumb(img);f.metrics[g.id]={density:m.density,flakes:g.id==="parting"?m.flakes:null,w:g.id==="temples"?.25:g.id==="parting"?.35:.4}}
  else{const c=document.createElement("canvas"),w=Math.min(1200,img.width);c.width=w;c.height=Math.round(w*img.height/img.width);c.getContext("2d").drawImage(img,0,0,c.width,c.height);f.cardCanvas=c;f.taps=[];f.cal=null}
  render()});
});
/* sample values for a new check follow the answers; later months improve */
function demoValues(a){
 const m=S.checks.length,k=Math.pow(.55,m);
 const base={"Hair fall":{density:46,flakes:6,ph:5.3,k:.14},"Dandruff & itching":{density:80,flakes:55,ph:6.6,k:.3},"Oily scalp":{density:78,flakes:22,ph:6.0,k:.2},"Dull, breaking hair":{density:82,flakes:5,ph:5.3,k:.72}}[a.concern]||{density:80,flakes:6,ph:5.2,k:.2};
 const b={...base};if(a.treat==="Often")b.k=Math.max(b.k,.6);if(a.feel==="Itchy")b.flakes+=12;if(a.feel==="Sensitive, reactive")b.ph+=.3;
 const goal={density:80,flakes:4,ph:5.1,k:.2};
 return{density:goal.density+(b.density-goal.density)*k,flakes:Math.round(goal.flakes+(b.flakes-goal.flakes)*k),ph:Math.round((goal.ph+(b.ph-goal.ph)*k)*10)/10,k:Math.round((goal.k+(b.k-goal.k)*k)*100)/100,red:a.feel==="Itchy"&&m<2};
}
render();
}
</script>
</body>
